name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    # No AI attribution in a pull request's commits (AGENTS.md); a copy of ouro-ui-core's check.
    name: attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/attribution.mjs "origin/$BASE_REF" "$PR_HEAD"

  generated:
    # The Windows projections, the composed-UI catalog and card match the declarations, and the vendored core files
    # match their release and tag, by hash.
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vendored core files match their release and tag, by SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/provenance.mjs check
      - name: The pixel checks catch what CI has caught before
        run: node --test tools/*.test.mts
      - name: The sample's Windows projections match its declarations
        run: node vendor/core/ouro-actions-windows.mts check samples/OuroShop/shopping.actions.mts samples/OuroShop/Generated
      - name: The sample's composed-UI catalog and card (as a tree and as A2UI) match its declarations, and the card validates
        run: |
          node vendor/core/ouro-a2ui-catalog.mts check samples/OuroShop/shopping.actions.mts samples/OuroShop/Composed/catalog.json
          node samples/OuroShop/shopping.composed.mts check

  actions:
    # Everything that runs off Windows: Ouro.Actions (the runtime contract every door goes through, on the sample's
    # generated catalog, the composed tree and the A2UI adapter against core's conformance cases) and the kit's colour rules over every
    # theme core ships.
    name: actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Ouro.Tests -c Release --logger "console;verbosity=normal"

  nvda:
    # NVDA, through Guidepup, reading Ouro Shop's tables page the way ourostack/ouro-ui's screen-reader lane reads the web
    # (ourostack/ouro-ui-windows#79). The UI Automation claims in the `windows` job stay the base check.
    name: nvda
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      EV: ${{ github.workspace }}\evidence
      APP: ${{ github.workspace }}\out\app\OuroShop.WinUI.exe
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Ouro Shop
        run: |
          dotnet publish samples/OuroShop/OuroShop.WinUI -c Release -o out/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Guidepup and NVDA
        working-directory: tools/nvda
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx guidepup setup --ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx guidepup install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: NVDA reads the tables page
        run: |
          New-Item -ItemType Directory -Force -Path $env:EV | Out-Null
          Start-Process -FilePath $env:APP -ArgumentList "--self-report --page tables --theme light" | Out-Null
          . tools/uia.ps1
          [void](Wait-OuroElement OuroShop.WinUI gallery.table.basic)
          Start-Sleep -Seconds 3
          cmd /c "node tools/nvda/read.mts > ""$env:EV\nvda.log"" 2>&1"
          $code = $LASTEXITCODE
          '```' + "`n" + (Get-Content "$env:EV\nvda.log" -Raw) + "`n" + '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvda-evidence
          path: evidence

  windows:
    # The kit on a free windows-latest runner (Windows Server, so no App Actions runtime, no Agent Registry and no
    # Mica: README). Build the kit and Ouro Shop, package and install the MSIX, then check that agents and people agree
    # (X-ray), that every component passes core's claims under the Windows settings they name, that the composed tree
    # is drawn and pressed as it says, and measure the feel.
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      EV: ${{ github.workspace }}\evidence
      APP: ${{ github.workspace }}\out\app\OuroShop.WinUI.exe
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Machine
        run: |
          New-Item -ItemType Directory -Force -Path $env:EV | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $odr = Get-Command odr.exe -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Windows.Forms
          [ordered]@{ caption = $os.Caption; version = $os.Version; build = $os.BuildNumber; ubr = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR; odr = if ($odr) { $odr.Source } else { $null }; dotnet = (dotnet --version); screen = "$([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width)x$([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)" } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:EV\machine.json"; Get-Content "$env:EV\machine.json"
      - name: Build the kit, Ouro Shop, its MCP server and the catalog probe
        id: build
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          dotnet build src/Ouro.UI.Windows -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish samples/OuroShop/OuroShop.WinUI -c Release -o out/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path out/app/resources.pri) -and -not (Test-Path out/app/OuroShop.WinUI.pri)) { Write-Host "::error::Ouro Shop's publish has no resources.pri: Ouro controls would draw nothing (EnableMsixTooling)"; exit 1 }
          dotnet publish samples/OuroShop/OuroShop.Mcp -c Release -o out/mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish tools/catalog -c Release -o out/catalog
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $size = { param($d) [math]::Round(((Get-ChildItem -Recurse $d | Measure-Object Length -Sum).Sum / 1MB), 1) }
          [ordered]@{ buildSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 1); appOutputMB = (& $size out/app); mcpOutputMB = (& $size out/mcp) } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:EV\build.json"; Get-Content "$env:EV\build.json"
      - name: Package, sign and install the MSIX
        run: |
          & tools/pack.ps1 -AppDir out\app -McpDir out\mcp -Generated samples\OuroShop\Generated -Manifest samples\OuroShop\package\AppxManifest.xml -Out out\msix
          Copy-Item out\msix\package.json "$env:EV\package.json"
          $pkg = Get-AppxPackage -Name Ouro.Shop
          Copy-Item "$($pkg.InstallLocation)\Assets\Actions\app-actions.json" "$env:EV\registered-app-actions.json"
          Copy-Item "$($pkg.InstallLocation)\Assets\Mcp\manifest.json" "$env:EV\registered-mcpb-manifest.json"
      - name: Ask Windows for its App Actions catalog and Agent Registry
        continue-on-error: true
        run: |
          out\catalog\OuroShop.Catalog.exe | Set-Content -Encoding utf8 "$env:EV\catalog.json"; Get-Content "$env:EV\catalog.json"
          if (Get-Command odr.exe -ErrorAction SilentlyContinue) { odr.exe mcp list | Set-Content -Encoding utf8 "$env:EV\odr-mcp-list.txt" } else { "odr.exe is not on this machine (it needs Windows 11 build 26220.7262 or later)" | Set-Content -Encoding utf8 "$env:EV\odr-mcp-list.txt" }
          $text = "$env:EV\registration.txt"
          "Installed package and its extensions:" | Set-Content -Encoding utf8 $text
          Get-Content "$env:EV\package.json" | Add-Content $text
          "", "Windows.AI.Actions catalog (ActionCatalog.GetAllActions):" | Add-Content $text
          Get-Content "$env:EV\catalog.json" | Add-Content $text
          "", "On-device Agent Registry:" | Add-Content $text
          Get-Content "$env:EV\odr-mcp-list.txt" | Add-Content $text
          & tools/render-text.ps1 -In $text -Out "$env:EV\app-action-registration.png" -Title "Ouro Shop: what Windows registered (rendered from CI output)"
      - name: Windows registered both agent doors, with the actions the declarations generate
        run: |
          node tools/registration-check.mts "$env:EV\package.json" "$env:EV\registered-app-actions.json" samples/OuroShop/Generated/app-actions.json "$env:EV\registered-mcpb-manifest.json" samples/OuroShop/Generated/mcpb.manifest.json "$env:EV\registration-check.json"
          $r = Get-Content "$env:EV\registration-check.json" | ConvertFrom-Json
          $odr = Get-Content "$env:EV\odr-mcp-list.txt" -Raw
          "Windows registered the doors [$($r.doors -join ', ')] for $($r.actions.Count) App Actions and $($r.tools.Count) MCP tools. Whether Windows lists them to agents: $(if ($odr -match 'not on this machine') { 'not checked, the runner has no On-device Agent Registry' } else { 'odr.exe answered, see odr-mcp-list.txt' })" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: MCP server, from the package, asks the person before a consequential call
        run: |
          $answer = Start-Process powershell -PassThru -NoNewWindow -RedirectStandardOutput "$env:EV\answer-dialog.log" -ArgumentList "-NoProfile", "-File", "tools\answer-dialog.ps1", "-Title", "`"Ouro Shop: Share list`"", "-Press", "No", "-Out", "$env:EV\confirm-mcp.json", "-Screenshot", "$env:EV\confirm-mcp.png"
          node tools/mcp-probe.mts "$env:EV\mcp-probe.json" "$env:LOCALAPPDATA\Microsoft\WindowsApps\OuroShop.Mcp.exe"
          $code = $LASTEXITCODE
          $answer | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          Get-Content "$env:EV\answer-dialog.log" -ErrorAction SilentlyContinue
          exit $code
      - name: Read each page as people and agents see it, under each setting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $pages = { param([string]$s, [string]$extra = "", [switch]$Shots)
            $a = @{}; if ($Shots) { $a.Screenshot = "$env:EV\list-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report $extra" -ProcessName OuroShop.WinUI -Out "$env:EV\uia-$s.json" @a
            $g = @{}; if ($Shots) { $g.Screenshot = "$env:EV\gallery-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page gallery $extra" -ProcessName OuroShop.WinUI -ReadyId card.gallery -Out "$env:EV\uia-gallery-$s.json" @g
            $f = @{}; if ($Shots) { $f.Screenshot = "$env:EV\fields-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page fields $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.descriptionlist.recipe -Out "$env:EV\uia-fields-$s.json" @f
            $n = @{}; if ($Shots) { $n.Screenshot = "$env:EV\nav-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page nav $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.sidebar.collapsed-rail -Out "$env:EV\uia-nav-$s.json" @n
            $l = @{}; if ($Shots) { $l.Screenshot = "$env:EV\lists-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page lists $extra" -ProcessName OuroShop.WinUI -ReadyId card.lists -Out "$env:EV\uia-lists-$s.json" @l
            $o = @{}; if ($Shots) { $o.Screenshot = "$env:EV\overlays-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page overlays $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.sheet.filters -Out "$env:EV\uia-overlays-$s.json" @o
            $k = @{}; if ($Shots) { $k.Screenshot = "$env:EV\confirms-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page confirms $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.confirm.delete -Out "$env:EV\uia-confirms-$s.json" @k
            $m = @{}; if ($Shots) { $m.Screenshot = "$env:EV\forms-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page forms $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.switch.wifi -Out "$env:EV\uia-forms-$s.json" @m
            $h = @{}; if ($Shots) { $h.Screenshot = "$env:EV\chat-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page chat $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.message.received -Out "$env:EV\uia-chat-$s.json" @h
            $t = @{}; if ($Shots) { $t.Screenshot = "$env:EV\tables-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page tables $extra" -ProcessName OuroShop.WinUI -ReadyId gallery.table.basic -Out "$env:EV\uia-tables-$s.json" @t
            $c = @{}; if ($Shots) { $c.Screenshot = "$env:EV\composed-$s.png" }
            & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page composed $extra" -ProcessName OuroShop.WinUI -ReadyId composed.add_item -Out "$env:EV\uia-composed-$s.json" @c
          }
          & tools/a11y.ps1 -Animations on -TextScale 100 -Contrast off
          & $pages light "--theme light" -Shots
          & $pages dark "--theme dark" -Shots
          & tools/dump.ps1 -Command "ouro-shop://action/place_grocery_order?token=spoofed" -ProcessName OuroShop.WinUI -Out "$env:EV\uia-uri-person-only.json" -Screenshot "$env:EV\refusal-app-action.png"
          & tools/dump.ps1 -Command "ouro-shop://action/add_shopping_list_item?name=oat%20milk&token=t1" -ProcessName OuroShop.WinUI -Out "$env:EV\uia-uri-write.json" -Screenshot "$env:EV\app-action-add.png"
          & tools/a11y.ps1 -Animations off -TextScale 100 -Contrast off
          & $pages noanim
          & tools/a11y.ps1 -Animations on -TextScale 225 -Contrast off
          & $pages text225 -Shots
          & tools/a11y.ps1 -Animations on -TextScale 100 -Contrast on
          & $pages contrast -Shots
          & tools/a11y.ps1 -Animations on -TextScale 100 -Contrast off
      - name: The composed tree, drawn and pressed (fields, a run, a confirm, a handoff), sent itself and as A2UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          & tools/composed.ps1 -Command $env:APP -ProcessName OuroShop.WinUI -Out "$env:EV\composed-presses.json" -Screenshot "$env:EV\composed-confirm.png"
          & tools/dump.ps1 -Command $env:APP -Arguments "--self-report --page a2ui --theme light" -ProcessName OuroShop.WinUI -ReadyId composed.add_item -Out "$env:EV\uia-a2ui-light.json" -Screenshot "$env:EV\a2ui-light.png"
          & tools/a2ui.ps1 -Command $env:APP -ProcessName OuroShop.WinUI -Out "$env:EV\a2ui-presses.json"
          node tools/composed.mts $env:EV
          $code = $LASTEXITCODE
          Get-Content "$env:EV\composed.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: X-ray (agents and people agree)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node tools/xray.mts samples/OuroShop/shopping.actions.mts $env:EV
          $code = $LASTEXITCODE
          Get-Content "$env:EV\xray.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Core's claims, for every component
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node tools/claims.mts $env:EV
          $code = $LASTEXITCODE
          Get-Content "$env:EV\claims.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Measure feel (unpackaged and MSIX)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          & tools/measure.ps1 -Label "Ouro Shop (unpackaged)" -Command $env:APP -ProcessName OuroShop.WinUI -Out "$env:EV\measure-app.json"
          & tools/measure.ps1 -Label "Ouro Shop (MSIX)" -Command "$env:LOCALAPPDATA\Microsoft\WindowsApps\OuroShop.exe" -ProcessName OuroShop.WinUI -Out "$env:EV\measure-msix.json"
          node tools/measure-report.mts "$env:EV\measure.md" "$env:EV\measure-app.json" "$env:EV\measure-msix.json"
          Get-Content "$env:EV\measure.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: If the app didn't start, what Windows logged
        if: failure()
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-40) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in ".NET Runtime", "Application Error", "Application Hang", "Windows Error Reporting" } |
            Select-Object -First 8 | ForEach-Object { "[$($_.TimeCreated)] $($_.ProviderName) $($_.Id)"; $_.Message; "" } | Tee-Object "$env:EV\app-errors.txt"
          $crash = "$env:LOCALAPPDATA\OuroShop\crash.txt"
          if (Test-Path $crash) { Copy-Item $crash "$env:EV\crash.txt"; Get-Content $crash }
      - name: Remove the package, the certificate and the contrast theme
        if: always()
        run: |
          & tools/a11y.ps1 -Animations on -TextScale 100 -Contrast off
          Get-Process -Name OuroShop.WinUI, OuroShop.Mcp -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-AppxPackage -Name Ouro.Shop | Remove-AppxPackage -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Subject -eq "CN=Ouro Shop Sample" | Remove-Item -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq "CN=Ouro Shop Sample" | Remove-Item -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence
          path: evidence
